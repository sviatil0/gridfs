[package]
name = "gridfs"
version = "0.1.0"
edition = "2021"
authors = ["Stefan Oleksiienko"]
license = "MIT"
description = "A toy in-memory FAT-style filesystem in safe Rust"
readme = "README.md"
repository = "https://github.com/sviatil0/gridfs"
keywords = ["filesystem", "fat", "education", "no-std-compatible"]
categories = ["filesystem", "data-structures"]
rust-version = "1.74"

[lib]
name = "gridfs"
path = "src/lib.rs"

[[bin]]
name = "gridfs-cli"
path = "src/bin/gridfs-cli.rs"

[dependencies]
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.10"

[[bench]]
name = "bench"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
